name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Remote PWA and run test suite
        run: npm run build:remote && npm test

      - name: Smoke check macOS installer
        if: runner.os == 'macOS'
        run: bash -n install.sh uninstall.sh && bash install.sh --dry-run

      - name: Smoke check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw uninstall.ps1))
