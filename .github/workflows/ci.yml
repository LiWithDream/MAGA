name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  stranded-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches and verify no unmerged branches are stranded
        shell: bash
        run: |
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TARGET_REF="HEAD"
          else
            TARGET_REF="origin/main"
          fi
          stranded="$(git branch -r --no-merged "$TARGET_REF" | grep -vE '^\s*origin/(HEAD|main)$' | sed 's/^[[:space:]]*//' || true)"
          if [[ -n "$stranded" ]]; then
            list="$(printf '%s' "$stranded" | tr '\n' ',' | sed 's/,$//')"
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              echo "::error::Refusing release tag while unmerged remote branches exist outside ${TARGET_REF}: ${list}"
              echo "$stranded"
              exit 1
            else
              echo "::warning::Unmerged remote branches exist outside ${TARGET_REF}: ${list}"
              echo "$stranded"
            fi
          else
            echo "No stranded unmerged remote branches outside ${TARGET_REF}."
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Remote PWA and run test suite
        run: npm run build:remote && npm test

      - name: Smoke check macOS installer
        if: runner.os == 'macOS'
        run: bash -n install.sh uninstall.sh && bash install.sh --dry-run

      - name: Smoke check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw uninstall.ps1))
