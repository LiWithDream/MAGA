name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stranded-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches and verify no unmerged branches are stranded
        shell: bash
        run: |
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TARGET_REF="HEAD"
          else
            TARGET_REF="origin/main"
          fi
          stranded="$(git branch -r --no-merged "$TARGET_REF" | grep -vE '^\s*origin/(HEAD|main|wip/.+)$' | sed 's/^[[:space:]]*//' || true)"
          if [[ -n "$stranded" ]]; then
            list="$(printf '%s' "$stranded" | tr '\n' ',' | sed 's/,$//')"
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              echo "::error::Refusing release tag while unmerged remote branches exist outside ${TARGET_REF}: ${list}"
              echo "$stranded"
              exit 1
            else
              echo "::warning::Unmerged remote branches exist outside ${TARGET_REF}: ${list}"
              echo "$stranded"
            fi
          else
            echo "No stranded unmerged remote branches outside ${TARGET_REF}."
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node-version: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Remote PWA and run test suite
        run: npm run build:remote && npm test

      - name: Smoke check macOS installer
        if: runner.os == 'macOS'
        run: bash -n install.sh uninstall.sh && bash install.sh --dry-run

      - name: Smoke check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw uninstall.ps1))

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [stranded-branches, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VER}."
            exit 1
          fi

      - name: Pack macOS and Windows release archives
        run: npm run release:pack:all -- --version "${GITHUB_REF_NAME#v}"

      - name: Verify release archive contents and checksums
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ls -lh dist/
          (cd dist && sha256sum -c "agy-studio-v${VER}-macos.tar.gz.sha256" && sha256sum -c "agy-studio-v${VER}-windows.zip.sha256")
          tar -tzf "dist/agy-studio-v${VER}-macos.tar.gz" > /tmp/macos-tar.list
          grep -Fq "remote/pwa/dist/app.js" /tmp/macos-tar.list
          unzip -l "dist/agy-studio-v${VER}-windows.zip" > /tmp/windows-zip.list
          grep -Fq "remote/pwa/dist/app.js" /tmp/windows-zip.list

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG_VER: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { extractChangelogNotes } from './studio/pack-release.mjs';
            const notes = extractChangelogNotes(readFileSync('CHANGELOG.md', 'utf8'), process.env.TAG_VER);
            if (notes) writeFileSync('/tmp/release-notes.md', notes + '\n', 'utf8');
          "

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(
            "dist/agy-studio-v${VER}-macos.tar.gz"
            "dist/agy-studio-v${VER}-macos.tar.gz.sha256"
            "dist/agy-studio-v${VER}-windows.zip"
            "dist/agy-studio-v${VER}-windows.zip.sha256"
          )
          RELEASE_FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [[ -s /tmp/release-notes.md ]]; then
            gh release create "$TAG" "${ASSETS[@]}" --title "AGY Studio ${TAG}" --notes-file /tmp/release-notes.md ${RELEASE_FLAGS[@]+"${RELEASE_FLAGS[@]}"}
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "AGY Studio ${TAG}" --generate-notes ${RELEASE_FLAGS[@]+"${RELEASE_FLAGS[@]}"}
          fi
